<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #090a0f;
      --bg-app-radial: radial-gradient(120% 85% at 50% -10%, #151928 0%, #0d0f17 50%, #08090d 100%);
      --bg-surface: rgba(18, 21, 31, 0.85);
      --bg-surface-solid: #12151f;
      --bg-card: rgba(24, 28, 42, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-card-hover: rgba(99, 102, 241, 0.45);
      --accent-primary: #6366f1;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    :root[data-theme="light"] {
      --bg-app: #f6f7fa;
      --bg-app-radial: radial-gradient(120% 85% at 50% -10%, #ffffff 0%, #f1f3f7 50%, #eaedf3 100%);
      --bg-surface: rgba(255, 255, 255, 0.9);
      --bg-surface-solid: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.08);
      --border-card-hover: rgba(99, 102, 241, 0.5);
      --text-primary: #0f172a;
      --text-muted: #64748b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #top-bar {
      height: 52px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 16px;
      z-index: 10;
    }
    #board-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px;
      gap: 16px;
      scroll-snap-type: x proximity;
    }
    .column-skeleton {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      height: 100%;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Top Navigation & Action Bar -->
  <header id="top-bar">
    <div class="top-left">
      <div class="brand">
        <svg class="brand-logo-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="mbt-logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#4f46e5"/>
            </linearGradient>
          </defs>
          <rect x="2" y="3" width="20" height="18" rx="5" fill="url(#mbt-logo-grad)"/>
          <rect x="5.5" y="6.5" width="5.5" height="4.5" rx="1.5" fill="#ffffff" fill-opacity="0.95"/>
          <rect x="5.5" y="13" width="5.5" height="5" rx="1.5" fill="#ffffff" fill-opacity="0.6"/>
          <rect x="13" y="6.5" width="5.5" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.95"/>
          <rect x="13" y="16" width="5.5" height="2" rx="1" fill="#ffffff" fill-opacity="0.45"/>
        </svg>
        <span class="brand-title">Minimal Board</span>
      </div>
      <nav id="workspace-switcher" class="workspace-tabs" aria-label="Workspaces">
        <!-- Rendered dynamically -->
      </nav>
    </div>

    <div class="top-center">
      <button id="search-trigger-btn" class="search-trigger" title="Search cards (Ctrl+K or /)">
        <svg class="search-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="search-placeholder">Find links, tags, notes...</span>
        <kbd class="shortcut-pill">⌘K</kbd>
      </button>
    </div>

    <div class="top-right">
      <button id="add-column-btn" class="btn-subtle" title="Add a new column (Shift+N)">
        <svg class="btn-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Column</span>
      </button>
      <button id="triage-trigger-btn" class="btn-subtle" title="Inbox Triage Review (r)">
        <svg class="btn-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span>Review</span>
      </button>
      <button id="drawer-toggle-btn" class="btn-subtle" title="Toggle Open Tabs Drawer (t)">
        <svg class="btn-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        <span>Tabs</span>
      </button>
      <button id="view-mode-btn" class="btn-icon" title="Toggle Board / List View">
        <svg class="view-mode-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
      <button id="theme-toggle-btn" class="btn-icon" title="Toggle Dark / Light Theme">
        <svg class="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="settings-btn" class="btn-icon" title="Settings & Backups">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Dynamic Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Modular Post-Paint Widgets Strip (FR-7.3) -->
  <section id="widgets-container" class="widgets-container" aria-label="Widgets Strip"></section>

  <!-- Main Kanban Board Area -->
  <main id="board-container" class="board-container" role="region" aria-label="Kanban Board">
    <!-- Initial skeleton placeholder before module hydration -->
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
  </main>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
