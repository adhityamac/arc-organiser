<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #07090e;
      --bg-app-radial: 
        radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(236, 72, 153, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 50% 82%, rgba(14, 165, 233, 0.28) 0%, transparent 52%),
        radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.28) 0%, transparent 45%),
        linear-gradient(180deg, #0a0d17 0%, #05060a 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
      --bg-surface-solid: #12151f;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --border-subtle: rgba(255, 255, 255, 0.22);
      --border-card-hover: rgba(255, 255, 255, 0.65);
      --accent-primary: #6366f1;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --glass-blur: blur(28px) saturate(190%);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] {
      --bg-app: #f4efe6;
      --bg-app-radial: 
        radial-gradient(circle at 18% 18%, rgba(245, 230, 215, 0.75) 0%, transparent 50%),
        radial-gradient(circle at 82% 22%, rgba(230, 240, 235, 0.7) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(220, 232, 222, 0.65) 0%, transparent 55%),
        linear-gradient(180deg, #faf7f2 0%, #ede6db 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.55) 100%);
      --bg-surface-solid: #ffffff;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.65) 100%);
      --border-subtle: rgba(255, 255, 255, 0.85);
      --border-card-hover: rgba(255, 255, 255, 0.98);
      --accent-primary: #4f46e5;
      --text-primary: #1e293b;
      --text-muted: #64748b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .sidebar-rail {
      display: none;
      width: 62px;
      height: calc(100vh - 24px);
      margin: 12px 0 12px 14px;
      flex-shrink: 0;
      border-radius: 26px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.6);
      z-index: 100;
    }
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    #top-bar {
      height: 58px;
      margin: 14px 28px 6px 28px;
      border-radius: 9999px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      gap: 16px;
      z-index: 10;
    }
    #board-container {
      flex: 1;
      columns: 280px;
      column-gap: 20px;
      padding: 16px 32px 56px 32px;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
    }
    .column-skeleton {
      width: 100%;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 18px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      height: 220px;
      display: inline-block;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Dynamic Fullscreen Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Glass Sidebar Navigation Rail (Left Obsidian Rail) -->
  <aside id="sidebar-rail" class="sidebar-rail" aria-label="Primary Navigation">
    <!-- Top Brand / Home Section -->
    <div class="rail-section-top">
      <button id="rail-brand-btn" class="rail-btn rail-brand-btn" aria-label="Minimal Board" title="Minimal Board">
        <svg class="rail-brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="rail-tooltip" role="tooltip">Minimal Board</span>
      </button>
    </div>

    <div class="rail-divider"></div>

    <!-- Middle Core Actions Section -->
    <div class="rail-section-mid">
      <button id="rail-workspaces-btn" class="rail-btn" aria-label="Workspaces" title="Workspaces">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span class="rail-tooltip" role="tooltip">Workspaces</span>
      </button>

      <button id="rail-search-btn" class="rail-btn" aria-label="Search" title="Search">
        <svg class="rail-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Search (⌘K)</span>
      </button>

      <button id="rail-drawer-btn" class="rail-btn" aria-label="Tabs Drawer" title="Tabs Drawer">
        <svg class="rail-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Tabs Drawer</span>
      </button>

      <button id="rail-add-column-btn" class="rail-btn" aria-label="Add Column" title="Add Column">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Add Column</span>
      </button>

      <button id="rail-view-mode-btn" class="rail-btn" aria-label="Bento Grid" title="Bento Grid Layout">
        <svg class="rail-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="11" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="18" width="7" height="3" rx="1"></rect>
        </svg>
        <span class="rail-tooltip" role="tooltip">Bento Grid</span>
      </button>
    </div>

    <!-- Flexible Spring Spacer -->
    <div class="rail-spacer"></div>

    <div class="rail-divider"></div>

    <!-- Bottom Settings & System Section -->
    <div class="rail-section-bottom">
      <button id="rail-theme-btn" class="rail-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <svg class="rail-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Toggle Theme</span>
      </button>

      <button id="rail-settings-btn" class="rail-btn" aria-label="Settings" title="Settings">
        <svg class="rail-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Settings</span>
      </button>

      <button id="rail-profile-btn" class="rail-btn rail-profile-btn" aria-label="Profile" title="Profile">
        <div class="rail-avatar-orb">
          <span class="rail-avatar-letter">M</span>
        </div>
        <span class="rail-tooltip" role="tooltip">Profile</span>
      </button>
    </div>
  </aside>

  <!-- Main Viewport (Contains Zen Floating Header & Kanban Board) -->
  <div class="main-viewport">
    <!-- Top Navigation & Action Bar (Zen Floating Header) -->
    <header id="top-bar">
      <div class="top-left">
        <nav id="workspace-switcher" class="workspace-tabs" role="tablist" aria-label="Workspaces">
          <!-- Rendered dynamically with Home, Projects, + -->
        </nav>
      </div>

      <div class="top-right" id="top-widgets-container">
        <!-- Mounted dynamically: Weather, Focus Today, Clock/Date -->
      </div>
    </header>

    <!-- Main Bento Board & Widget Cards Area -->
    <main id="board-container" class="board-container view-mode-bento" aria-label="Bento Board">
      <!-- Initial skeleton placeholder before module hydration -->
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
    </main>
  </div>

  <!-- Floating Circular Action Buttons (Bottom Right) -->
  <aside class="floating-fab-container" aria-label="Quick Actions">
    <button id="floating-wallpaper-btn" class="fab-circle" title="Wallpaper & Live Shaders Gallery" aria-label="Wallpaper and Live Shaders Gallery">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button id="floating-menu-btn" class="fab-circle" title="Menu & Actions" aria-label="Menu and Actions">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <button id="floating-settings-btn" class="fab-circle" title="Settings & Backups" aria-label="Settings and Backups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </aside>

  <!-- Quick Floating Menu Modal / Popover -->
  <div id="quick-menu-popover" class="quick-menu-popover" style="display: none;" role="menu">
    <button class="quick-menu-item" id="menu-add-column"><span class="menu-icon">➕</span> Add Column</button>
    <button class="quick-menu-item" id="menu-tabs-drawer"><span class="menu-icon">📑</span> Open Tabs Drawer</button>
    <button class="quick-menu-item" id="menu-theme-toggle"><span class="menu-icon">🌓</span> Toggle Light / Dark</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-wallpaper-gallery" style="color: var(--accent-primary); font-weight: 600;"><span class="menu-icon">✨</span> Wallpaper & Live Shaders...</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-import-bookmarks"><span class="menu-icon">📥</span> Import Chrome Bookmarks</button>
    <button class="quick-menu-item" id="menu-restore-starter"><span class="menu-icon">🗂️</span> Reset to Markmez Categories</button>
    <button class="quick-menu-item" id="menu-settings"><span class="menu-icon">⚙️</span> All Settings & Backups</button>
  </div>

  <!-- macOS Frosted Glass Context Menu -->
  <div id="macos-context-menu" class="macos-context-menu" style="display: none;" role="menu" aria-label="Context Menu"></div>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
