<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #07090e;
      --bg-app-radial: 
        radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.4) 0%, transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(236, 72, 153, 0.35) 0%, transparent 48%),
        radial-gradient(circle at 50% 82%, rgba(14, 165, 233, 0.32) 0%, transparent 52%),
        radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.3) 0%, transparent 45%),
        linear-gradient(180deg, #0d111e 0%, #05060a 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
      --bg-surface-solid: #12151f;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --border-subtle: rgba(255, 255, 255, 0.22);
      --border-card-hover: rgba(255, 255, 255, 0.6);
      --accent-primary: #818cf8;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #ffffff;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --glass-blur: blur(28px) saturate(210%) contrast(105%) brightness(108%);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] {
      --bg-app: #e9edf5;
      --bg-app-radial: 
        radial-gradient(circle at 12% 16%, rgba(199, 210, 254, 0.8) 0%, transparent 48%),
        radial-gradient(circle at 88% 20%, rgba(254, 205, 211, 0.7) 0%, transparent 48%),
        radial-gradient(circle at 50% 80%, rgba(186, 230, 253, 0.65) 0%, transparent 55%),
        radial-gradient(circle at 75% 85%, rgba(243, 232, 255, 0.7) 0%, transparent 48%),
        linear-gradient(180deg, #f2f5fb 0%, #e2e8f0 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.52) 100%);
      --bg-surface-solid: #ffffff;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.72) 100%);
      --border-subtle: rgba(255, 255, 255, 0.8);
      --border-card-hover: #ffffff;
      --accent-primary: #4f46e5;
      --text-primary: #0f172a;
      --text-muted: #64748b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #top-bar {
      height: 58px;
      margin: 14px 24px 6px;
      border-radius: 9999px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.35), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      gap: 16px;
      z-index: 10;
    }
    #board-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 24px 32px 24px;
      gap: 18px;
      scroll-snap-type: x proximity;
    }
    .column-skeleton {
      width: 290px;
      flex-shrink: 0;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      height: 75vh;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Dynamic Fullscreen Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Top Navigation & Action Bar (Zen Floating Header) -->
  <header id="top-bar">
    <div class="top-left">
      <nav id="workspace-switcher" class="workspace-tabs" role="tablist" aria-label="Workspaces">
        <!-- Rendered dynamically with Home, Projects, + -->
      </nav>
    </div>

    <div class="top-center">
      <div id="search-bar-wrap" class="search-bar-wrap">
        <svg class="search-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="main-search-input" class="main-search-input" placeholder="Search..." aria-label="Search saved links or Google">
        <button id="google-search-btn" class="search-engine-btn" title="Search with Google" aria-label="Search with Google">
          <svg class="google-icon" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="top-right" id="top-widgets-container">
      <!-- Mounted dynamically: Weather, Focus Today, Clock/Date -->
    </div>
  </header>

  <!-- Main Bento Board & Widget Cards Area -->
  <main id="board-container" class="board-container" aria-label="Kanban Board">
    <!-- Initial skeleton placeholder before module hydration -->
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
  </main>

  <!-- Floating Circular Action Buttons (Bottom Right) -->
  <aside class="floating-fab-container" aria-label="Quick Actions">
    <button id="floating-wallpaper-btn" class="fab-circle" title="Wallpaper & Live Shaders Gallery" aria-label="Wallpaper and Live Shaders Gallery">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button id="floating-menu-btn" class="fab-circle" title="Menu & Actions" aria-label="Menu and Actions">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <button id="floating-settings-btn" class="fab-circle" title="Settings & Backups" aria-label="Settings and Backups">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </aside>

  <!-- Quick Floating Menu Modal / Popover -->
  <div id="quick-menu-popover" class="quick-menu-popover" style="display: none;" role="menu">
    <button class="quick-menu-item" id="menu-add-column"><span class="menu-icon">➕</span> Add Column</button>
    <button class="quick-menu-item" id="menu-triage"><span class="menu-icon">📥</span> Review Inbox (Triage)</button>
    <button class="quick-menu-item" id="menu-tabs-drawer"><span class="menu-icon">📑</span> Open Tabs Drawer</button>
    <button class="quick-menu-item" id="menu-theme-toggle"><span class="menu-icon">🌓</span> Toggle Light / Dark</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-wallpaper-gallery" style="color: var(--accent-primary); font-weight: 600;"><span class="menu-icon">✨</span> Wallpaper & Live Shaders...</button>
    <button class="quick-menu-item" id="menu-wallpaper-mountain"><span class="menu-icon">🏔️</span> Misty Mountains</button>
    <button class="quick-menu-item" id="menu-wallpaper-forest"><span class="menu-icon">🌲</span> Deep Pine Forest</button>
    <button class="quick-menu-item" id="menu-wallpaper-inkwash"><span class="menu-icon">📜</span> Ink Landscape</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-settings"><span class="menu-icon">⚙️</span> All Settings & Backups</button>
  </div>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
