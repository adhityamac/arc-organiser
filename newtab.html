<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #07090e;
      --bg-app-radial: 
        radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(236, 72, 153, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 50% 82%, rgba(14, 165, 233, 0.28) 0%, transparent 52%),
        radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.28) 0%, transparent 45%),
        linear-gradient(180deg, #0a0d17 0%, #05060a 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
      --bg-surface-solid: #12151f;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --border-subtle: rgba(255, 255, 255, 0.22);
      --border-card-hover: rgba(255, 255, 255, 0.65);
      --accent-primary: #6366f1;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --glass-blur: blur(28px) saturate(190%);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] {
      --bg-app: #f4efe6;
      --bg-app-radial: 
        radial-gradient(circle at 18% 18%, rgba(245, 230, 215, 0.75) 0%, transparent 50%),
        radial-gradient(circle at 82% 22%, rgba(230, 240, 235, 0.7) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(220, 232, 222, 0.65) 0%, transparent 55%),
        linear-gradient(180deg, #faf7f2 0%, #ede6db 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.55) 100%);
      --bg-surface-solid: #ffffff;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.65) 100%);
      --border-subtle: rgba(255, 255, 255, 0.85);
      --border-card-hover: rgba(255, 255, 255, 0.98);
      --accent-primary: #4f46e5;
      --text-primary: #1e293b;
      --text-muted: #64748b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .sidebar-rail {
      width: 62px;
      height: calc(100vh - 24px);
      margin: 12px 0 12px 14px;
      flex-shrink: 0;
      border-radius: 26px;
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.65);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 12px 0;
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.45);
    }
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: calc(100vw - 76px);
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    #top-chrome-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      pointer-events: none;
    }
    .top-bar-piece,
    .dynamic-live-pill {
      pointer-events: auto;
    }
    #board-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      grid-auto-rows: 176px;
      grid-auto-flow: dense;
      gap: 16px;
      padding: 16px 32px 100px 32px;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
    }
    .column-skeleton {
      width: 100%;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 18px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      height: 220px;
      display: inline-block;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Dynamic Fullscreen Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Glass Sidebar Navigation Rail (Left Obsidian Rail - Image 2) -->
  <aside id="sidebar-rail" class="sidebar-rail" aria-label="Primary Navigation">
    <div class="rail-section-top">
      <button id="rail-brand-btn" class="rail-btn rail-brand-btn" aria-label="Minimal Board" title="Minimal Board">
        <svg class="rail-brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="rail-tooltip" role="tooltip">Minimal Board</span>
      </button>
    </div>

    <div class="rail-divider"></div>

    <div class="rail-section-mid">
      <button id="rail-workspaces-btn" class="rail-btn" aria-label="Workspaces" title="Workspaces">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Workspaces (W)</span>
      </button>

      <button id="rail-search-btn" class="rail-btn" aria-label="Command Search (⌘K)" title="Command Search (⌘K)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Search (⌘K)</span>
      </button>

      <button id="rail-triage-btn" class="rail-btn" aria-label="Inbox Triage (T)" title="Inbox Triage (T)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
        <span id="rail-triage-badge" class="rail-badge-dot" style="display: none;"></span>
        <span class="rail-tooltip" role="tooltip">Inbox Triage (T)</span>
      </button>

      <button id="rail-drawer-btn" class="rail-btn" aria-label="Tabs Drawer (D)" title="Tabs Drawer (D)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Open Tabs (D)</span>
      </button>

      <button id="rail-add-column-btn" class="rail-btn" aria-label="Add Column (C)" title="Add Column (C)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">New Column (C)</span>
      </button>

      <button id="rail-view-mode-btn" class="rail-btn" aria-label="Toggle View Mode (V)" title="Toggle View Mode (V)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Bento Grid (V)</span>
      </button>

      <button id="rail-theme-btn" class="rail-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Theme (Dark/Light)</span>
      </button>

      <button id="rail-settings-btn" class="rail-btn" aria-label="Settings" title="Settings">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Settings & Wallpapers</span>
      </button>
    </div>

    <!-- Bottom Profile Section (Rainbow Profile Orb - Image 2) -->
    <div class="rail-section-bottom">
      <button id="rail-profile-btn" class="rail-btn rail-profile-btn" aria-label="Profile & Atmosphere" title="Profile & Atmosphere">
        <div class="rail-avatar-orb" aria-hidden="true"></div>
        <span class="rail-tooltip" role="tooltip">Profile & Atmosphere</span>
      </button>
    </div>
  </aside>

  <!-- Main Viewport (Full 100% width with clean rail layout) -->
  <div class="main-viewport">
    <!-- Top Floating Chrome Container (Dynamic Island & Controls) -->
    <header id="top-chrome-container" class="top-chrome-container" aria-label="Top Chrome Navigation">
      <!-- 1. Left Piece: Segmented Workspace Switcher with sliding pill thumb -->
      <div id="top-bar-left" class="top-bar-piece glass">
        <nav id="workspace-switcher" class="workspace-tabs segmented-control" role="tablist" aria-label="Workspaces">
          <!-- Rendered dynamically with Home, Work, Projects, + -->
        </nav>
      </div>

      <!-- 2. Center Piece: Unified Morphing Dynamic Island (Image 1) -->
      <div id="top-bar-center" class="top-bar-center-wrap">
        <div id="dynamic-island" class="dynamic-island glass" role="region" aria-label="Dynamic Island">
          <!-- Idle State: Time · Weather | Focus Badge | ⌘K Search Hint -->
          <div class="island-idle">
            <div class="island-time-weather">
              <span class="live-pill-time">--:--</span>
              <span class="live-pill-dot">•</span>
              <button id="top-weather-chip" class="island-weather-chip top-chip" title="Weather (Click to change city)" aria-label="Weather">
                <span class="weather-temp">65°</span>
                <span class="weather-icon">☀️</span>
              </button>
            </div>
            <div class="island-divider" aria-hidden="true"></div>
            <button id="island-focus-badge" class="island-focus-badge" title="Focus Mode (Click to cycle)" aria-label="Focus Mode Status">
              <span class="focus-dot dot-work"></span>
              <span class="focus-label">WORK</span>
            </button>
            <div class="island-divider" aria-hidden="true"></div>
            <button id="island-search-trigger" class="island-search-trigger" title="Search (⌘K)" aria-label="Search">
              <svg class="island-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span class="island-search-key">⌘K</span>
            </button>
          </div>

          <!-- Expanded State: Full Search Input + Status Toggle -->
          <div class="island-expanded" style="display: none;">
            <svg class="island-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="island-search-input" class="island-search-input" placeholder="Search bookmarks, tabs, or web..." aria-label="Search bookmarks, tabs, or web" autocomplete="off" spellcheck="false">
            <button id="island-focus-badge-mini" class="island-focus-badge mini" title="Focus Mode (Click to cycle)" aria-label="Focus Mode">
              <span class="focus-dot dot-work"></span>
              <span class="focus-label">WORK</span>
            </button>
            <button id="island-close-btn" class="island-close-btn" title="Close Search (Esc)" aria-label="Close Search">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Legacy Dynamic Live Pill Hidden Hook for Pomodoro Timers -->
          <div id="dynamic-live-pill" style="display: none;" aria-hidden="true">
            <span class="live-pill-time">--:--</span>
            <span class="live-pill-date">---</span>
            <div class="live-pill-active">
              <svg class="live-pill-ring" width="24" height="24" viewBox="0 0 24 24"><circle class="live-ring-bg" cx="12" cy="12" r="9"/><circle class="live-ring-fill" cx="12" cy="12" r="9"/></svg>
              <span class="live-pill-mode">FOCUS</span>
              <span class="live-pill-digits">25:00</span>
              <button id="live-pill-toggle-btn"></button>
              <button id="live-pill-stop-btn"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Right Piece: Search button, Theme toggle, Palette switcher, Settings -->
      <div id="top-bar-right" class="top-bar-piece glass">
        <!-- Search Button (⌘K) -->
        <button id="top-search-btn" class="top-chip top-search-chip" title="Search (⌘K)" aria-label="Search Bookmarks and Tabs">
          <svg class="top-chip-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="search-shortcut">⌘K</span>
        </button>

        <!-- Theme Toggle (Light / Dark) -->
        <button id="top-theme-btn" class="top-icon-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
          <svg class="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Curated Palette Picker Button -->
        <button id="top-palette-btn" class="top-icon-btn palette-switcher-btn" title="Curated Pastel Themes (Lavender, Matcha, Sky, Coral)" aria-label="Curated Palettes">
          <span class="palette-swatch-cluster" aria-hidden="true">
            <span class="swatch-cluster-dot dot-lavender"></span>
            <span class="swatch-cluster-dot dot-matcha"></span>
            <span class="swatch-cluster-dot dot-sky"></span>
            <span class="swatch-cluster-dot dot-coral"></span>
          </span>
        </button>

        <!-- Settings / Menu Trigger -->
        <button id="top-settings-btn" class="top-icon-btn" title="Settings & Menu" aria-label="Settings and Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Bento Board & Widget Cards Area -->
    <main id="board-container" class="board-container view-mode-bento" aria-label="Bento Board">
      <!-- Initial skeleton placeholder before module hydration -->
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
    </main>
  </div>

  <!-- Floating Palette Popover (Attached to #top-palette-btn) -->
  <div id="palette-picker-popover" class="palette-picker-popover glass" style="display: none;" role="menu" aria-label="Curated Palettes">
    <div class="palette-popover-title">Curated Palettes</div>
    <div class="palette-options-list">
      <button class="palette-option-item" data-palette="lavender" role="menuitem">
        <span class="palette-preview dot-lavender"></span>
        <span class="palette-option-name">Lavender Iris</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="matcha" role="menuitem">
        <span class="palette-preview dot-matcha"></span>
        <span class="palette-option-name">Matcha Green</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="sky" role="menuitem">
        <span class="palette-preview dot-sky"></span>
        <span class="palette-option-name">Sky Dawn</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="coral" role="menuitem">
        <span class="palette-preview dot-coral"></span>
        <span class="palette-option-name">Coral Blush</span>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <span class="dock-tooltip" role="tooltip">Add Column</span>
