<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --primary: #f2b0f4;
      --bg-app: #120e14;
      --bg-app-radial: 
        radial-gradient(circle at 18% 18%, color-mix(in srgb, var(--primary) 14%, transparent) 0%, transparent 50%),
        radial-gradient(circle at 82% 22%, color-mix(in srgb, var(--primary) 10%, transparent) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--primary) 12%, transparent) 0%, transparent 55%),
        linear-gradient(180deg, #120e14 0%, #0a080c 100%);
      --bg-surface: color-mix(in srgb, #1e1a20 55%, transparent);
      --bg-surface-solid: #1e1a20;
      --bg-card: #1e1a20;
      --border-subtle: rgba(255, 255, 255, 0.14);
      --border-card-hover: rgba(255, 255, 255, 0.35);
      --accent-primary: #f2b0f4;
      --accent-danger: #ffb4ab;
      --accent-success: #93d79b;
      --accent-warning: #ffb951;
      --text-primary: #ede0eb;
      --text-muted: #a69da9;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --glass-blur: blur(24px) saturate(180%);
      --ease-spring: cubic-bezier(.2, .9, .3, 1.15);
    }
    :root[data-theme="light"] {
      --primary: #874a8a;
      --bg-app: #f6ecf6;
      --bg-app-radial: 
        radial-gradient(circle at 18% 18%, color-mix(in srgb, var(--primary) 12%, transparent) 0%, transparent 50%),
        radial-gradient(circle at 82% 22%, color-mix(in srgb, var(--primary) 8%, transparent) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, color-mix(in srgb, var(--primary) 10%, transparent) 0%, transparent 55%),
        linear-gradient(180deg, #f6ecf6 0%, #f1e4f1 100%);
      --bg-surface: color-mix(in srgb, #ffffff 55%, transparent);
      --bg-surface-solid: #ffffff;
      --bg-card: #ffffff;
      --border-subtle: color-mix(in srgb, #1d1a1e 12%, transparent);
      --border-card-hover: color-mix(in srgb, #1d1a1e 24%, transparent);
      --accent-primary: #874a8a;
      --accent-danger: #ba1a1a;
      --accent-success: #2e6c38;
      --accent-warning: #8c5000;
      --text-primary: #1d1a1e;
      --text-muted: #6b6470;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .sidebar-rail {
      width: 62px;
      height: calc(100vh - 24px);
      margin: 12px 0 12px 14px;
      flex-shrink: 0;
      border-radius: 26px;
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.65);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 12px 0;
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.45);
    }
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: calc(100vw - 76px);
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    #top-chrome-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      pointer-events: none;
    }
    .hero-atmosphere,
    .top-search-wrap,
    .widget-shelf {
      pointer-events: auto;
    }
    #board-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      grid-auto-rows: 176px;
      grid-auto-flow: dense;
      gap: 16px;
      padding: 16px 24px 32px 24px;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
    }
    .column-skeleton {
      width: 100%;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 18px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      height: 220px;
      display: inline-block;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Dynamic Fullscreen Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Glass Sidebar Navigation Rail (Left Obsidian Rail - Image 2) -->
  <aside id="sidebar-rail" class="sidebar-rail" aria-label="Primary Navigation">
    <div class="rail-section-top">
      <button type="button" id="rail-brand-btn" class="rail-btn rail-brand-btn" aria-label="Minimal Board" title="Minimal Board">
        <svg class="rail-brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="rail-tooltip" role="tooltip">Minimal Board</span>
      </button>
    </div>

    <div class="rail-divider"></div>

    <!-- Workspaces in Left Rail -->
    <div id="rail-workspaces" class="rail-workspaces-group" role="tablist" aria-label="Workspaces"></div>

    <div class="rail-section-mid">
      <button type="button" id="rail-drawer-btn" class="rail-btn" aria-label="Tabs Drawer (D)" title="Tabs Drawer (D)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Open Tabs (D)</span>
      </button>

      <button type="button" id="rail-add-column-btn" class="rail-btn" aria-label="Add Column (C)" title="Add Column (C)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">New Column (C)</span>
      </button>

      <button type="button" id="rail-triage-btn" class="rail-btn" aria-label="Inbox Triage (T)" title="Inbox Triage (T)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
          <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
        </svg>
        <span id="rail-triage-badge" class="rail-badge-dot" style="display: none;"></span>
        <span class="rail-tooltip" role="tooltip">Inbox Triage (T)</span>
      </button>

      <button type="button" id="rail-view-mode-btn" class="rail-btn" aria-label="Toggle View Mode (V)" title="Toggle View Mode (V)">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="rail-tooltip" role="tooltip">Bento Grid (V)</span>
      </button>

      <button type="button" id="rail-theme-btn" class="rail-btn" aria-label="Toggle Theme" title="Toggle Theme">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Theme (Dark/Light)</span>
      </button>

      <button type="button" id="rail-settings-btn" class="rail-btn" aria-label="Settings" title="Settings">
        <svg class="rail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="rail-tooltip" role="tooltip">Settings & Wallpapers</span>
      </button>
    </div>

    <!-- Bottom Profile Section (Rainbow Profile Orb - Image 2) -->
    <div class="rail-section-bottom">
      <button type="button" id="rail-profile-btn" class="rail-btn rail-profile-btn" aria-label="Profile & Atmosphere" title="Profile & Atmosphere">
        <div class="rail-avatar-orb" aria-hidden="true"></div>
        <span class="rail-tooltip" role="tooltip">Profile & Atmosphere</span>
      </button>
    </div>
  </aside>

  <!-- Main Viewport (Full 100% width with clean rail layout) -->
  <div class="main-viewport">
    <!-- Top Floating Chrome Container (Hero Atmosphere & Integrated Search Bar) -->
    <header id="top-chrome-container" class="top-chrome-container" role="search" aria-label="Search Bookmarks and Tabs">
      <div class="hero-atmosphere">
        <div id="hero-date" class="hero-date">Tuesday, 12 March</div>
        <h1 id="hero-clock" class="hero-clock">21:23</h1>
        <div id="hero-weather-sub" class="hero-weather-sub"><span class="hero-weather-icon">⛅</span> <span class="hero-weather-text">24°C · Scattered Clouds</span></div>
      </div>
      <div class="top-search-wrap">
        <svg class="top-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="top-search-input" class="top-search-input" role="searchbox" enterkeyhint="search" placeholder="Search bookmarks, tabs, or web..." aria-label="Search bookmarks, tabs, or web" autocomplete="off" spellcheck="false">
        <span class="top-search-badge" aria-hidden="true">⌘K</span>
        <button type="button" id="top-search-clear-btn" class="top-search-clear-btn" style="display: none;" title="Clear Search (Esc)" aria-label="Clear Search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Widgets Shelf (Clover Quick-Capture & Pebble Weather) -->
    <div id="widget-shelf" class="widget-shelf" role="region" aria-label="Quick Widgets">
      <!-- Clover Quick-Capture Cluster (Image 2) -->
      <div id="clover-capture-widget" class="clover-widget" aria-label="Quick Capture">
        <button type="button" id="clover-btn-task" class="clover-leaf leaf-top" title="New Task" aria-label="New Task">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button type="button" id="clover-btn-drawer" class="clover-leaf leaf-left" title="Open Tabs Drawer" aria-label="Open Tabs Drawer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <button type="button" id="clover-btn-center" class="clover-center-btn" title="Quick Add Link" aria-label="Quick Add Link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" id="clover-btn-note" class="clover-leaf leaf-right" title="Quick Note" aria-label="Quick Note">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button type="button" id="clover-btn-window" class="clover-leaf leaf-bottom" title="Save Window Session" aria-label="Save Window Session">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/></svg>
        </button>
      </div>

      <!-- Pebble Weather Widget (Image 1 & 3) -->
      <button type="button" id="pebble-weather-widget" class="pebble-weather-blob" title="Weather (Click to change location)" aria-label="Current Weather">
        <span class="pebble-temp">65°</span>
        <span class="pebble-icon">☀️</span>
      </button>
    </div>

    <!-- Main Bento Board & Widget Cards Area -->
    <main id="board-container" class="board-container view-mode-bento" aria-label="Bento Board">
      <!-- Initial skeleton placeholder before module hydration -->
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
    </main>
  </div>

  <!-- Quick Floating Menu Modal / Popover -->
  <div id="quick-menu-popover" class="quick-menu-popover" style="display: none;" role="menu">
    <button class="quick-menu-item" id="menu-add-column"><span class="menu-icon">➕</span> Add Column</button>
    <button class="quick-menu-item" id="menu-tabs-drawer"><span class="menu-icon">📑</span> Open Tabs Drawer</button>
    <button class="quick-menu-item" id="menu-theme-toggle"><span class="menu-icon">🌓</span> Toggle Light / Dark</button>
    <button class="quick-menu-item" id="menu-palette-toggle"><span class="menu-icon">🎨</span> Switch Palette Theme</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-wallpaper-gallery" style="color: var(--accent-primary); font-weight: 600;"><span class="menu-icon">✨</span> Wallpaper & Live Shaders...</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-import-bookmarks"><span class="menu-icon">📥</span> Import Chrome Bookmarks</button>
    <button class="quick-menu-item" id="menu-restore-starter"><span class="menu-icon">🗂️</span> Reset to Markmez Categories</button>
    <button class="quick-menu-item" id="menu-settings"><span class="menu-icon">⚙️</span> All Settings & Backups</button>
  </div>


  <!-- macOS Frosted Glass Context Menu -->
  <div id="macos-context-menu" class="macos-context-menu" style="display: none;" role="menu" aria-label="Context Menu"></div>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
