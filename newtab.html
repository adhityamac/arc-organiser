<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #0f0f11;
      --bg-surface: #18181b;
      --bg-card: #222226;
      --border-subtle: #27272a;
      --border-card-hover: #3f3f46;
      --accent-primary: #3b82f6;
      --accent-danger: #ef4444;
      --accent-success: #22c55e;
      --accent-warning: #f59e0b;
      --text-primary: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    #top-bar {
      height: 52px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      gap: 16px;
      z-index: 10;
    }
    #board-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px;
      gap: 16px;
      scroll-snap-type: x proximity;
    }
    .column-skeleton {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      height: 100%;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Top Navigation & Action Bar -->
  <header id="top-bar">
    <div class="top-left">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-title">Minimal Board</span>
      </div>
      <nav id="workspace-switcher" class="workspace-tabs" aria-label="Workspaces">
        <!-- Rendered dynamically -->
      </nav>
    </div>

    <div class="top-center">
      <button id="search-trigger-btn" class="search-trigger" title="Search cards (Ctrl+K or /)">
        <span class="search-icon">🔍</span>
        <span class="search-placeholder">Find links, tags, notes...</span>
        <kbd class="shortcut-pill">/</kbd>
      </button>
    </div>

    <div class="top-right">
      <button id="add-column-btn" class="btn-subtle" title="Add a new column (Shift+N)">
        <span>+ Column</span>
      </button>
      <button id="drawer-toggle-btn" class="btn-subtle" title="Toggle Open Tabs Drawer (t)">
        <span>Tabs</span>
      </button>
      <button id="settings-btn" class="btn-icon" title="Settings & Backups">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Main Kanban Board Area -->
  <main id="board-container" class="board-container" role="region" aria-label="Kanban Board">
    <!-- Initial skeleton placeholder before module hydration -->
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
    <div class="column-skeleton"></div>
  </main>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
