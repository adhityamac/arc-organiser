<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Board</title>
  <style>
    /* Critical Inline CSS for sub-15ms First Paint */
    :root {
      --bg-app: #07090e;
      --bg-app-radial: 
        radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(236, 72, 153, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 50% 82%, rgba(14, 165, 233, 0.28) 0%, transparent 52%),
        radial-gradient(circle at 75% 75%, rgba(168, 85, 247, 0.28) 0%, transparent 45%),
        linear-gradient(180deg, #0a0d17 0%, #05060a 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 100%);
      --bg-surface-solid: #12151f;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --border-subtle: rgba(255, 255, 255, 0.22);
      --border-card-hover: rgba(255, 255, 255, 0.65);
      --accent-primary: #6366f1;
      --accent-danger: #f43f5e;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --glass-blur: blur(28px) saturate(190%);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] {
      --bg-app: #f4efe6;
      --bg-app-radial: 
        radial-gradient(circle at 18% 18%, rgba(245, 230, 215, 0.75) 0%, transparent 50%),
        radial-gradient(circle at 82% 22%, rgba(230, 240, 235, 0.7) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(220, 232, 222, 0.65) 0%, transparent 55%),
        linear-gradient(180deg, #faf7f2 0%, #ede6db 100%);
      --bg-surface: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.55) 100%);
      --bg-surface-solid: #ffffff;
      --bg-card: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.65) 100%);
      --border-subtle: rgba(255, 255, 255, 0.85);
      --border-card-hover: rgba(255, 255, 255, 0.98);
      --accent-primary: #4f46e5;
      --text-primary: #1e293b;
      --text-muted: #64748b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-app);
      background-image: var(--bg-app-radial);
      background-attachment: fixed;
      background-size: cover;
      color: var(--text-primary);
      font-family: var(--font-stack);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .sidebar-rail {
      display: none !important;
    }
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    #top-chrome-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      pointer-events: none;
    }
    .top-bar-piece,
    .dynamic-live-pill {
      pointer-events: auto;
    }
    #board-container {
      flex: 1;
      columns: 280px;
      column-gap: 20px;
      padding: 16px 32px 100px 32px;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
    }
    .column-skeleton {
      width: 100%;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 18px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
      height: 220px;
      display: inline-block;
    }
  </style>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Dynamic Fullscreen Wallpaper Layer (FR-7.2) -->
  <div id="wallpaper-layer" class="wallpaper-layer"></div>

  <!-- Main Viewport (Full 100% width with no left gap) -->
  <div class="main-viewport">
    <!-- Top Floating Chrome Container (Phase 4: Step 11, Image 2 style 3 Glass Pieces) -->
    <header id="top-chrome-container" class="top-chrome-container" aria-label="Top Chrome Navigation">
      <!-- 1. Left Piece: Segmented Workspace Switcher with sliding pill thumb -->
      <div id="top-bar-left" class="top-bar-piece glass">
        <nav id="workspace-switcher" class="workspace-tabs segmented-control" role="tablist" aria-label="Workspaces">
          <!-- Rendered dynamically with Home, Work, Projects, + -->
        </nav>
      </div>

      <!-- 2. Center Piece: Dynamic Live Pill (Time/Date at rest; Morphs into Live Countdown Progress Ring) -->
      <div id="top-bar-center" class="top-bar-center-wrap">
        <div id="dynamic-live-pill" class="dynamic-live-pill glass" role="region" aria-label="Live Status Pill" tabindex="0">
          <div class="live-pill-rest">
            <span class="live-pill-time">--:--</span>
            <span class="live-pill-dot">•</span>
            <span class="live-pill-date">---, --- --</span>
          </div>
          <div class="live-pill-active" style="display: none;">
            <div class="live-pill-ring-wrap" aria-hidden="true">
              <svg class="live-pill-ring" width="24" height="24" viewBox="0 0 24 24">
                <circle class="live-ring-bg" cx="12" cy="12" r="9" stroke-width="2.5" fill="none" />
                <circle class="live-ring-fill" cx="12" cy="12" r="9" stroke-width="2.5" fill="none" stroke-linecap="round" />
              </svg>
            </div>
            <div class="live-pill-timer-text">
              <span class="live-pill-mode">FOCUS</span>
              <span class="live-pill-digits">25:00</span>
            </div>
            <div class="live-pill-actions">
              <button id="live-pill-toggle-btn" class="live-pill-btn" title="Pause / Resume Timer" aria-label="Pause or Resume Timer">
                <svg class="icon-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"/>
                  <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <svg class="icon-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                  <polygon points="6 4 19 12 6 20 6 4"/>
                </svg>
              </button>
              <button id="live-pill-stop-btn" class="live-pill-btn" title="Stop Timer" aria-label="Stop Timer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="5" y="5" width="14" height="14" rx="2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Right Piece: Weather chip, Search button, Theme toggle, Palette switcher, Settings -->
      <div id="top-bar-right" class="top-bar-piece glass">
        <!-- Weather Chip -->
        <button id="top-weather-chip" class="top-chip" title="Weather (Click to change city)" aria-label="Weather">
          <span class="weather-temp">65°</span>
          <span class="weather-icon">☀️</span>
        </button>

        <!-- Search Button (⌘K) -->
        <button id="top-search-btn" class="top-chip top-search-chip" title="Search (⌘K)" aria-label="Search Bookmarks and Tabs">
          <svg class="top-chip-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="search-shortcut">⌘K</span>
        </button>

        <!-- Theme Toggle (Light / Dark) -->
        <button id="top-theme-btn" class="top-icon-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
          <svg class="theme-icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Curated Palette Picker Button -->
        <button id="top-palette-btn" class="top-icon-btn palette-switcher-btn" title="Curated Pastel Themes (Lavender, Matcha, Sky, Coral)" aria-label="Curated Palettes">
          <span class="palette-swatch-cluster" aria-hidden="true">
            <span class="swatch-cluster-dot dot-lavender"></span>
            <span class="swatch-cluster-dot dot-matcha"></span>
            <span class="swatch-cluster-dot dot-sky"></span>
            <span class="swatch-cluster-dot dot-coral"></span>
          </span>
        </button>

        <!-- Settings / Menu Trigger -->
        <button id="top-settings-btn" class="top-icon-btn" title="Settings & Menu" aria-label="Settings and Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Bento Board & Widget Cards Area -->
    <main id="board-container" class="board-container view-mode-bento" aria-label="Bento Board">
      <!-- Initial skeleton placeholder before module hydration -->
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
      <div class="column-skeleton"></div>
    </main>
  </div>

  <!-- Floating Palette Popover (Attached to #top-palette-btn) -->
  <div id="palette-picker-popover" class="palette-picker-popover glass" style="display: none;" role="menu" aria-label="Curated Palettes">
    <div class="palette-popover-title">Curated Palettes</div>
    <div class="palette-options-list">
      <button class="palette-option-item" data-palette="lavender" role="menuitem">
        <span class="palette-preview dot-lavender"></span>
        <span class="palette-option-name">Lavender Iris</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="matcha" role="menuitem">
        <span class="palette-preview dot-matcha"></span>
        <span class="palette-option-name">Matcha Green</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="sky" role="menuitem">
        <span class="palette-preview dot-sky"></span>
        <span class="palette-option-name">Sky Dawn</span>
        <span class="palette-check-mark">✓</span>
      </button>
      <button class="palette-option-item" data-palette="coral" role="menuitem">
        <span class="palette-preview dot-coral"></span>
        <span class="palette-option-name">Coral Blush</span>
        <span class="palette-check-mark">✓</span>
      </button>
    </div>
  </div>

  <!-- Floating Bottom Dock (Phase 4: Step 12, Image 2 style) -->
  <nav id="bottom-dock" class="bottom-dock glass" aria-label="Workspace & Quick Action Dock">
    <!-- Workspaces with icons and active dots -->
    <div id="dock-workspaces" class="dock-workspaces-group" role="tablist" aria-label="Workspaces">
      <!-- Populated dynamically with workspace items -->
    </div>

    <!-- Elegant Dock Divider -->
    <div class="dock-divider" aria-hidden="true"></div>

    <!-- Action Buttons -->
    <div class="dock-actions-group">
      <button id="dock-add-bookmark-btn" class="dock-item" aria-label="Add Bookmark" title="Add Bookmark (+)">
        <span class="dock-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
        <span class="dock-tooltip" role="tooltip">Add Bookmark</span>
      </button>

      <button id="dock-drawer-btn" class="dock-item" aria-label="Tabs Drawer" title="Tabs Drawer">
        <span class="dock-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </span>
        <span class="dock-tooltip" role="tooltip">Tabs Drawer</span>
      </button>

      <button id="dock-wallpaper-btn" class="dock-item" aria-label="Wallpaper & Live Shaders Gallery" title="Wallpaper & Live Shaders Gallery">
        <span class="dock-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </span>
        <span class="dock-tooltip" role="tooltip">Wallpapers & Shaders</span>
      </button>

      <button id="dock-add-column-btn" class="dock-item" aria-label="Quick Capture / Add Column" title="Quick Capture / Add Column">
        <span class="dock-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="18" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="18" rx="1.5"></rect>
          </svg>
        </span>
        <span class="dock-tooltip" role="tooltip">Add Column</span>
      </button>
    </div>
  </nav>

  <!-- Quick Floating Menu Modal / Popover -->
  <div id="quick-menu-popover" class="quick-menu-popover" style="display: none;" role="menu">
    <button class="quick-menu-item" id="menu-add-column"><span class="menu-icon">➕</span> Add Column</button>
    <button class="quick-menu-item" id="menu-tabs-drawer"><span class="menu-icon">📑</span> Open Tabs Drawer</button>
    <button class="quick-menu-item" id="menu-theme-toggle"><span class="menu-icon">🌓</span> Toggle Light / Dark</button>
    <button class="quick-menu-item" id="menu-palette-toggle"><span class="menu-icon">🎨</span> Switch Palette Theme</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-wallpaper-gallery" style="color: var(--accent-primary); font-weight: 600;"><span class="menu-icon">✨</span> Wallpaper & Live Shaders...</button>
    <div class="menu-divider"></div>
    <button class="quick-menu-item" id="menu-import-bookmarks"><span class="menu-icon">📥</span> Import Chrome Bookmarks</button>
    <button class="quick-menu-item" id="menu-restore-starter"><span class="menu-icon">🗂️</span> Reset to Markmez Categories</button>
    <button class="quick-menu-item" id="menu-settings"><span class="menu-icon">⚙️</span> All Settings & Backups</button>
  </div>

  <!-- macOS Frosted Glass Context Menu -->
  <div id="macos-context-menu" class="macos-context-menu" style="display: none;" role="menu" aria-label="Context Menu"></div>

  <!-- Toast Notification Area (Undo, Alerts) -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Deferred Module Script -->
  <script type="module" src="newtab.js"></script>
</body>
</html>
